services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waf
      POSTGRES_PASSWORD: waf
      POSTGRES_DB: waf
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAF_DATABASE_URL: postgresql+psycopg2://waf:waf@postgres:5432/waf
      WAF_RULES_RENDER_DIR: /render/modsecurity-rules
      WAF_SITES_RENDER_DIR: /render/nginx-sites
      WAF_LOG_SINK_CONFIG_PATH: /render/log-sinks/log-sinks.json
      WAF_DISCORD_WEBHOOK_CONFIG_PATH: /render/discord/webhooks.json
      WAF_ERROR_PAGES_RENDER_DIR: /render/error-pages
      WAF_ENGINE_SETTINGS_RENDER_DIR: /render/engine-settings
      WAF_IP_RULES_RENDER_DIR: /render/ip-rules
      WAF_AUDIT_LOG_DIR: /data/logs/live
      WAF_AUDIT_LOG_ARCHIVE_DIR: /data/logs/archive
      WAF_AUDIT_LOG_FORMAT: modsec_v3_json
    volumes:
      - rules-render:/render/modsecurity-rules
      - sites-render:/render/nginx-sites
      - log-sink-config:/render/log-sinks
      - discord-config:/render/discord
      - error-pages-render:/render/error-pages
      - engine-settings-render:/render/engine-settings
      - ip-rules-render:/render/ip-rules
      - audit-logs:/data/logs:ro
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # No VITE_API_BASE_URL here on purpose - the frontend derives it from
    # whatever host the browser used to load the dashboard (see
    # api/client.ts), which works whether that's localhost, a LAN IP, or
    # a real hostname. Set this explicitly only if the API isn't reachable
    # on the same host at port 8000 (e.g. behind a reverse proxy).
    ports:
      - "5173:5173"

  # The traffic path ("jalur") - nginx + ModSecurity v3 + whatever rules and
  # sites the dashboard has rendered. See CLAUDE.md.
  waf-engine:
    build: ./waf-engine
    depends_on:
      - backend
    environment:
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit/live/audit.log
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
    volumes:
      - rules-render:/etc/modsecurity.d/dashboard-rules
      - sites-render:/etc/nginx/conf.d/dashboard-sites
      - error-pages-render:/usr/share/nginx/sentinel-error-pages
      - engine-settings-render:/etc/modsecurity.d/dashboard-engine-settings
      - ip-rules-render:/etc/modsecurity.d/dashboard-ip-rules
      - audit-logs:/var/log/modsecurity/audit
    ports:
      - "8080:8080"
      # Default TLS listen port for a Site with HTTPS enabled (manual
      # cert upload, see CLAUDE.md) - if a site's tls_listen_port is
      # changed from the 8443 default, add a matching mapping here too,
      # same as listen_port already works for plain HTTP.
      - "8443:8443"

  log-forwarder:
    build: ./log-forwarder
    depends_on:
      - backend
    volumes:
      - audit-logs:/data/logs:ro
      - log-sink-config:/render/log-sinks:ro
      - discord-config:/render/discord:ro
      - log-forwarder-state:/state

volumes:
  pg-data:
  rules-render:
  sites-render:
  log-sink-config:
  discord-config:
  error-pages-render:
  engine-settings-render:
  ip-rules-render:
  audit-logs:
  log-forwarder-state:
