# Serves the built React SPA and reverse-proxies /api/* to the backend
# container by its Docker-internal service name - the backend never
# needs its own port exposed to the host in production mode (see
# docker-compose.prod.yml), only this one.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (react-router) - any path that isn't a real
    # static file falls back to index.html so a direct load of e.g.
    # /rules/5 doesn't 404 against nginx's own file lookup.
    location / {
        try_files $uri /index.html;
    }
}
