# Custom block/error pages, content managed from the dashboard's Error
# Pages tab (see backend/app/api/error_pages.py). The set of status codes
# here is fixed - adding a new one requires editing this file and
# rebuilding the waf-engine image, then adding the code to
# backend/app/default_error_pages.py. Included inside every generated
# site server block (see render_service.render_sites()).
error_page 403 /__sentinel-error-pages__/403.html;
error_page 413 /__sentinel-error-pages__/413.html;
error_page 429 /__sentinel-error-pages__/429.html;
error_page 503 /__sentinel-error-pages__/503.html;

location ^~ /__sentinel-error-pages__/ {
    internal;
    alias /usr/share/nginx/sentinel-error-pages/;
}
